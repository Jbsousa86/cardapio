<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Menu | Faça seu pedido</title>
    <meta name="description" content="Cardápio online. Escolha seus produtos e peça diretamente pelo WhatsApp.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="container header-content">
            <!-- As informações abaixo agora são alteradas automaticamente pelo arquivo script.js! -->
            <img src="" alt="Logo" class="brand-logo" id="brand-logo" style="display: none;">
            <h1 class="logo" id="brand-name">Nome do <span>Estabelecimento</span></h1>
            <p class="subtitle" id="brand-subtitle">Seu subtítulo principal vai aqui</p>
            <p id="brand-slogan">Slogan ou aviso adicional vai aqui</p>
            
            <div class="header-actions">
                <button class="theme-toggle" id="theme-toggle" title="Alternar tema" aria-label="Alternar tema" aria-pressed="false">☀️</button>
                <button class="btn-share" id="btn-share" title="Compartilhar Cardápio">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Seção Promoção de Hoje (preenchida via script.js se disponível) -->
        <section id="promo-section" class="promo-section" style="display:none; margin-bottom:1.5rem;">
            <div class="promo-card">
                <div class="promo-image-wrapper">
                    <img id="promo-image" src="" alt="Promoção" class="promo-image" style="display:none; width:140px; height:140px; object-fit:cover; border-radius:12px;">
                </div>
                <div class="promo-content">
                    <h2 id="promo-title"></h2>
                    <p id="promo-desc" class="small-muted"></p>
                    <div style="display:flex; gap:1rem; align-items:center; margin-top:0.6rem;">
                        <div id="promo-price" style="font-weight:800;"></div>
                        <button id="promo-order" class="btn-order">Aproveitar</button>
                    </div>
                </div>
            </div>
        </section>
        <section class="menu-section">
            <div class="menu-header">
                <h2 class="section-title">Nosso Cardápio</h2>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Buscar produto...">
                </div>
                <nav id="category-menu" class="category-menu">
                    <!-- Categorias geradas automaticamente pelo script.js -->
                </nav>
            </div>

            <div class="grid" id="product-list">
                <!-- Os produtos serão carregados aqui automaticamente pelo script.js -->
            </div>
        </section>
    </main>

    <!-- Botão de Voltar ao Topo -->
    <button id="back-to-top" class="back-to-top" title="Voltar ao topo">
        ↑
    </button>

    <!-- Botão Flutuante do Carrinho -->
    <button id="cart-fab" class="cart-fab" style="display: none;">
        🛒 <span id="cart-badge" class="cart-badge">0</span>
    </button>

    <!-- Modal de Extras/Adicionais -->
    <div id="extras-overlay" class="cart-overlay"></div>
    <div id="extras-modal" class="cart-modal">
        <div class="cart-header">
            <h2 id="extras-title">Adicionais</h2>
            <button id="close-extras" class="btn-close">&times;</button>
        </div>
        <div id="extras-list" class="cart-items" style="gap: 0.5rem;"></div>
        <div class="cart-footer"><button id="btn-confirm-extras" class="btn-checkout">Confirmar Adição</button></div>
    </div>

    <!-- Modal do Carrinho -->
    <div id="cart-overlay" class="cart-overlay"></div>
    <div id="cart-modal" class="cart-modal">
        <div class="cart-header">
            <h2>Seu Pedido</h2>
            <button id="close-cart" class="btn-close">&times;</button>
        </div>
        <div class="cart-body" style="overflow-y: auto; flex: 1;">
            <div id="cart-items" class="cart-items" style="overflow-y: visible; flex: none; padding-bottom: 0.5rem;"></div>
            
            <div class="cart-customer-info" style="padding: 0 1.5rem 0.5rem 1.5rem;">
                <input type="text" id="cart-customer-name" class="cart-input" placeholder="Seu Nome completo..." style="margin-bottom: 0.5rem;">
                <input type="tel" id="cart-customer-phone" class="cart-input" placeholder="Seu celular/WhatsApp...">
            </div>

            <div class="cart-payment" style="padding: 0 1.5rem 1rem 1.5rem;">
                <select id="cart-payment-method" class="cart-select">
                    <option value="">Forma de Pagamento...</option>
                    <option value="Pix">Pix</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>
            <div class="cart-observations" style="padding: 0 1.5rem 1rem 1.5rem;">
                <textarea id="cart-notes" class="cart-input" placeholder="Endereço de entrega completo com número e bairro (Obrigatório)..." rows="2"></textarea>
            </div>
        </div>
        <div class="cart-footer">
            <div class="cart-total"><span>Total:</span> <span id="cart-total-price">R$ 0,00</span></div>
            <button id="btn-checkout" class="btn-checkout">Finalizar Pedido 💬</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="year"></span> jbstech.</p>
        </div>
    </footer>

    <!-- Firebase SDK (Versão Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
