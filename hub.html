<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Lojas | Cardápio Multi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #f8fafc;
            --accent: #10b981;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            text-align: center;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
        }

        .store-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .store-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
        }

        .store-icon {
            font-size: 2.5rem;
            background: rgba(16, 185, 129, 0.1);
            width: 80px; height: 80px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }

        .btn {
            background: var(--accent);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            box-sizing: border-box;
            border: none;
        }

        /* Estilos do Login */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .login-box {
            background: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 92%;
            max-width: 380px;
            backdrop-filter: blur(15px);
        }

        .login-box input {
            width: 100%;
            padding: 1rem;
            margin: 1.5rem 0 1rem 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-family: inherit;
            font-size: 1.1rem;
            text-align: center;
            box-sizing: border-box;
        }

        #error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
        }

        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Tela de Login -->
    <div id="login-overlay">
        <div class="login-box">
            <div class="store-icon">🔐</div>
            <h2>Acesso Restrito</h2>
            <p>Digite a senha administrativa</p>
            <input type="password" id="admin-pass" placeholder="Senha">
            <button class="btn" onclick="checkAccess()">Entrar no Painel</button>
            <p id="error-msg">Senha incorreta!</p>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div id="main-content">
        <h1>Painel de Lojas</h1>
        <p>Acesse o cardápio de cada estabelecimento</p>

        <div class="grid" id="store-grid">
            <!-- Gerado via JS -->
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        const ADMIN_PASSWORD = "admin123";
        const overlay = document.getElementById('login-overlay');
        const mainContent = document.getElementById('main-content');
        const errorMsg = document.getElementById('error-msg');

        function checkSession() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                showContent();
            }
        }

        function checkAccess() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                sessionStorage.setItem('isLoggedIn', 'true');
                showContent();
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function showContent() {
            overlay.style.display = 'none';
            mainContent.style.display = 'flex';
            renderStores();
        }

        function renderStores() {
            const storeGrid = document.getElementById('store-grid');
            storeGrid.innerHTML = '';

            const icons = {
                'default': '🏠',
                'pizzaria': '🍕',
                'Imperio-do-Acai': '🍧'
            };

            Object.keys(STORES_DATA).forEach(key => {
                const store = STORES_DATA[key];
                const name = `${store.CONFIG.name} ${store.CONFIG.nameHighlight}`;
                const icon = icons[key] || '🛍️';

                const card = document.createElement('a');
                card.href = `index.html?s=${key}`;
                card.className = 'store-card';
                card.innerHTML = `
                    <div class="store-icon">${icon}</div>
                    <div class="store-name">${name}</div>
                    <div class="btn">Abrir Cardápio</div>
                `;
                storeGrid.appendChild(card);
            });
        }

        checkSession();
    </script>
</body>
</html>
